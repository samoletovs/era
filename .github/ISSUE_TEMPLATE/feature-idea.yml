name: "💡 Feature idea"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement you'd like to see.
      placeholder: "It would be great if the invoice list could be filtered by date range..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why is this useful?
      description: How would this help your workflow?
      placeholder: "Currently I have to scroll through hundreds of invoices to find last month's..."
    validations:
      required: false
